<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 515" role="img" aria-labelledby="title desc">
<title id="title">Magic: guess nearby, then check the time</title><desc id="desc">On a proportional time axis zoomed to 0.60–1.00, the orange guessed interval 2 ends at 0.91. The purple query at 0.95 lies in green interval 3. Move one interval right.</desc>
<rect width="1000" height="515" rx="12" fill="#ffffff"/>
<text x="40" y="40" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="start">Magic: guess nearby, then check the time.</text>
<text x="70" y="88" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start">1. Predict a nearby interval</text>
<rect x="70" y="105" width="520" height="80" rx="8" fill="#f8fafc" stroke="#dbe3ed"/>
<text x="135" y="130" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#7c3aed" text-anchor="middle">query time</text>
<text x="135" y="158" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#7c3aed" text-anchor="middle">t = 0.95</text>
<line x1="213" y1="147" x2="243" y2="147" stroke="#64748b" stroke-width="2" stroke-dasharray=""/>
<polygon points="243,147 234,143 234,151" fill="#64748b"/>
<text x="330" y="130" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">predicted index</text>
<text x="330" y="158" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#0f172a" text-anchor="middle">≈ 2.877</text>
<line x1="418" y1="147" x2="461" y2="147" stroke="#c2410c" stroke-width="2" stroke-dasharray=""/>
<polygon points="461,147 452,143 452,151" fill="#c2410c"/>
<text x="526.875" y="130" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#c2410c" text-anchor="middle">floor</text>
<text x="526.875" y="158" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#c2410c" text-anchor="middle">i = 2</text>
<line x1="526.875" y1="190" x2="526.875" y2="266" stroke="#c2410c" stroke-width="2" stroke-dasharray=""/>
<polygon points="526.875,266 530.875,257 522.875,257" fill="#c2410c"/>
<text x="70" y="230" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start">2. Check the actual time</text>
<text x="813.75" y="236" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#7c3aed" text-anchor="middle">t = 0.95</text>
<rect x="70" y="270" width="191.25" height="100" rx="8" fill="#f8fafc" stroke="#dbe3ed"/>
<text x="165.625" y="328" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#94a3b8" text-anchor="middle">0</text>
<rect x="261.25" y="270" width="63.75" height="100" rx="8" fill="#f8fafc" stroke="#dbe3ed"/>
<text x="293.125" y="328" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#94a3b8" text-anchor="middle">1</text>
<rect x="325" y="270" width="403.75" height="100" rx="8" fill="#fff7ed" stroke="#c2410c"/>
<text x="526.875" y="303" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#c2410c" text-anchor="middle">GUESS</text>
<text x="526.875" y="340" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#c2410c" text-anchor="middle">interval 2</text>
<rect x="728.75" y="270" width="191.25" height="100" rx="8" fill="#f0fdf4" stroke="#15803d"/>
<text x="866.875" y="303" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#15803d" text-anchor="middle">CONTAINS t</text>
<text x="866.875" y="340" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#15803d" text-anchor="middle">interval 3</text>
<line x1="70" y1="390" x2="920" y2="390" stroke="#64748b" stroke-width="1" stroke-dasharray=""/>
<line x1="65" y1="386" x2="70" y2="394" stroke="#64748b" stroke-width="2" stroke-dasharray=""/>
<line x1="72" y1="386" x2="77" y2="394" stroke="#64748b" stroke-width="2" stroke-dasharray=""/>
<text x="70" y="416" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#64748b" text-anchor="middle">0.6</text>
<line x1="261.25" y1="370" x2="261.25" y2="396" stroke="#64748b" stroke-width="1" stroke-dasharray=""/>
<text x="261.25" y="416" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#0f172a" text-anchor="middle">0.69</text>
<line x1="325" y1="370" x2="325" y2="396" stroke="#64748b" stroke-width="1" stroke-dasharray=""/>
<text x="325" y="416" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#0f172a" text-anchor="middle">0.72</text>
<line x1="728.75" y1="370" x2="728.75" y2="396" stroke="#64748b" stroke-width="1" stroke-dasharray=""/>
<text x="728.75" y="416" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#0f172a" text-anchor="middle">0.91</text>
<line x1="920" y1="370" x2="920" y2="396" stroke="#64748b" stroke-width="1" stroke-dasharray=""/>
<text x="920" y="416" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#0f172a" text-anchor="middle">1</text>
<line x1="813.75" y1="245" x2="813.75" y2="390" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4"/>
<circle cx="813.75" cy="390" r="5" fill="#7c3aed"/>
<text x="947" y="416" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">time</text>
<line x1="526.875" y1="455" x2="824.375" y2="455" stroke="#15803d" stroke-width="2" stroke-dasharray=""/>
<polygon points="824.375,455 815.375,451 815.375,459" fill="#15803d"/>
<text x="675.625" y="439" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#15803d" text-anchor="middle">t = 0.95 &gt; times[3] = 0.91</text>
<text x="675.625" y="483" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#15803d" text-anchor="middle">2 + 1 → 3</text>
</svg>
